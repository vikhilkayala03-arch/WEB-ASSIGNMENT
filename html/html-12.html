<!DOCTYPE html>
<html>
<head>

    <title>CSS Selectors</title>

    <style>

        /* Element selector */
        h1 {
            color: blue;
            font-family: Arial;
        }

        /* Class selector */
        .student {
            color: green;
            font-size: 20px;
        }

        /* ID selector */
        #special {
            color: red;
            background-color: yellow;
        }

        /* Universal selector */
        * {
            box-sizing: border-box;
        }

        .box {
            border: 3px solid black;
            padding: 20px;
            margin: 20px;
            background-color: lightblue;
            font-family: Georgia;
        }

    </style>

</head>

<body>

    <h1>CSS Selectors</h1>

    <p class="student">
        This paragraph uses a class selector.
    </p>

    <p id="special">
        This paragraph uses an ID selector.
    </p>

    <div class="box">
        This box demonstrates:
        <br><br>
        Colors<br>
        Fonts<br>
        Margins<br>
        Padding<br>
        Borders
    </div>

</body>
</html>
