<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Input Types</title>

    <style>
        body {
            font-family: Arial;
        }

        form {
            width: 400px;
            margin: auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <h1 align="center">HTML5 Input Types</h1>

    <form>

        <label>Email:</label>
        <input type="email"
               placeholder="Enter email">

        <label>Password:</label>
        <input type="password"
               placeholder="Enter password">

        <label>Date:</label>
        <input type="date">

        <label>Number:</label>
        <input type="number"
               min="1"
               max="100">

        <label>Telephone:</label>
        <input type="tel">

        <label>Website:</label>
        <input type="url">

        <input type="submit"
               value="Submit">

    </form>

</body>
</html>
