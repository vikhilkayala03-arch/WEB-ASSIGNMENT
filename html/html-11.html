<!DOCTYPE html>
<html>
<head>

    <title>CSS Types</title>

    <!-- Internal CSS -->
    <style>

        body {
            background-color: lightgray;
        }

        h1 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 20px;
        }

    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>CSS Styling</h1>

    <!-- Inline CSS -->
    <h2 style="color: red;">
        Inline CSS Example
    </h2>

    <p>
        This paragraph uses internal CSS.
    </p>

    <div class="box">
        This box uses external CSS.
    </div>

</body>
</html>
