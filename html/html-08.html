<!DOCTYPE html>
<html>
<head>
    <title>Semantic HTML</title>

    <style>
        header {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: black;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 20px;
            text-decoration: none;
        }

        section {
            padding: 20px;
        }

        article {
            background-color: lightgray;
            padding: 20px;
        }

        footer {
            background-color: lightblue;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Bright Future Academy</h1>
        <p>Learn Today, Lead Tomorrow</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <section>

        <h2>Our Courses</h2>

        <article>
            <h3>Web Development</h3>
            <p>
                Learn HTML, CSS and JavaScript.
            </p>
        </article>

        <article>
            <h3>Python Programming</h3>
            <p>
                Learn Python programming from basics.
            </p>
        </article>

    </section>

    <footer>
        <p>© 2026 Bright Future Academy</p>
    </footer>

</body>
</html>
