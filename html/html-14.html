<!DOCTYPE html>
<html>
<head>

    <title>Bootstrap Example</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a class="navbar-brand" href="#">
                My College
            </a>

            <div>
                <a class="nav-link d-inline text-white"
                   href="#">
                    Home
                </a>

                <a class="nav-link d-inline text-white"
                   href="#">
                    About
                </a>

                <a class="nav-link d-inline text-white"
                   href="#">
                    Contact
                </a>
            </div>

        </div>

    </nav>


    <!-- Main Content -->

    <div class="container mt-5">

        <h1 class="text-center text-primary">
            Welcome to My College
        </h1>

        <p class="text-center">
            Learn technology and build your future.
        </p>


        <!-- Cards -->

        <div class="row mt-4">

            <div class="col-md-4">

                <div class="card">

                    <div class="card-body">

                        <h3 class="card-title">
                            Web Development
                        </h3>

                        <p class="card-text">
                            Learn HTML, CSS and JavaScript.
                        </p>

                        <button class="btn btn-primary">
                            Learn More
                        </button>

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card">

                    <div class="card-body">

                        <h3 class="card-title">
                            Python
                        </h3>

                        <p class="card-text">
                            Learn Python programming.
                        </p>

                        <button class="btn btn-success">
                            Learn More
                        </button>

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card">

                    <div class="card-body">

                        <h3 class="card-title">
                            Data Science
                        </h3>

                        <p class="card-text">
                            Learn data analysis and AI.
                        </p>

                        <button class="btn btn-warning">
                            Learn More
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- Alert -->

        <div class="alert alert-info mt-5">
            Admissions are open now!
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
