<!DOCTYPE html>
<html>
<head>
    <title>College Timetable</title>

    <style>
        table {
            border-collapse: collapse;
            width: 90%;
            margin: auto;
        }

        th, td {
            border: 2px solid black;
            padding: 15px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>College Timetable</h1>

    <table>

        <tr>
            <th>Day</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:00 - 12:00</th>
            <th>12:00 - 1:00</th>
            <th>2:00 - 3:00</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>HTML</td>
            <td>Python</td>
            <td>Maths</td>
            <td rowspan="5">Lunch</td>
            <td>DAA</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>CSS</td>
            <td>Java</td>
            <td>English</td>
            <td>Python Lab</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>Maths</td>
            <td>HTML</td>
            <td>DAA</td>
            <td>Data Science</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>Java</td>
            <td>Python</td>
            <td>CSS</td>
            <td>Web Lab</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>DAA</td>
            <td>Maths</td>
            <td>Data Science</td>
            <td>Project</td>
        </tr>

    </table>

</body>
</html>
