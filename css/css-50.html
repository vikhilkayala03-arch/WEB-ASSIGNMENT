<!DOCTYPE html>
<html>
<head>
<style>
.container {
    display: flex;
    gap: 20px;
}

.column {
    flex: 1;
    padding: 50px;
    background: lightblue;
}

@media(max-width:600px) {
    .container {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="column">Column 1</div>
<div class="column">Column 2</div>
<div class="column">Column 3</div>

</div>

</body>
</html>
