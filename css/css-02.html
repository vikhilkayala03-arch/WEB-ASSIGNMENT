<!DOCTYPE html>
<html>
<head>
<style>
* {
    font-family: Arial;
}

p {
    color: blue;
}

.title {
    color: green;
}

#special {
    color: red;
}

h1, h2 {
    text-align: center;
}
</style>
</head>

<body>

<h1>CSS Selectors</h1>
<h2>Grouping Selector</h2>

<p>Element selector</p>

<p class="title">Class selector</p>

<p id="special">ID selector</p>

</body>
</html>
