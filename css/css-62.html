<!DOCTYPE html>
<html>
<head>
<style>
.container {
    display: flex;
    align-items: center;
    justify-content: space-around;
    height: 300px;
}

.box {
    padding: 30px;
    background: lightblue;
}

.one {
    order: 3;
}

.two {
    order: 1;
}

.three {
    order: 2;
}
</style>
</head>

<body>

<div class="container">

<div class="box one">One</div>
<div class="box two">Two</div>
<div class="box three">Three</div>

</div>

</body>
</html>
