<!DOCTYPE html>
<html>
<head>
<style>
.visible {
    visibility: visible;
}

.hidden {
    visibility: hidden;
}

.none {
    display: none;
}
</style>
</head>

<body>

<p class="visible">Visible element</p>

<p class="hidden">Hidden but space remains</p>

<p class="none">Display none</p>

</body>
</html>
