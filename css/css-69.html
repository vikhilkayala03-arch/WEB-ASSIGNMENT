<!DOCTYPE html>
<html>
<head>
<style>
.card {
    width: 200px;
    padding: 30px;
    background: lightblue;
    animation: slide 3s infinite alternate;
}

@keyframes slide {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(400px);
    }

}
</style>
</head>

<body>

<div class="card">
    Sliding Card
</div>

</body>
</html>
