<!DOCTYPE html>
<html>
<head>
<style>
.box1 {
    width: 300px;
    height: 150px;
    background: lightblue;
}

.box2 {
    width: 50%;
    height: 100px;
    background: lightgreen;
}

.box3 {
    width: 80vw;
    min-height: 100px;
    max-width: 600px;
    background: lightpink;
}
</style>
</head>

<body>

<div class="box1">300px × 150px</div>

<br>

<div class="box2">50% Width</div>

<br>

<div class="box3">Responsive sizing</div>

</body>
</html>
