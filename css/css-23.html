<!DOCTYPE html>
<html>
<head>
<style>
.card {
    width: 250px;
    margin: 50px auto;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 15px gray;
    border-radius: 10px;
}

.card img {
    width: 100%;
}

button {
    padding: 10px 25px;
    background: green;
    color: white;
    border: none;
}
</style>
</head>

<body>

<div class="card">

<img src="https://picsum.photos/250/180">

<h2>Smart Watch</h2>

<p>₹2,999</p>

<button>Buy Now</button>

</div>

</body>
</html>
