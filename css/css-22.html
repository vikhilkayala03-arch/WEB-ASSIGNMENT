<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: Arial;
    background: lightblue;
}

.login {
    width: 300px;
    margin: 100px auto;
    padding: 30px;
    background: white;
    border-radius: 10px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    background: blue;
    color: white;
    border: none;
}
</style>
</head>

<body>

<div class="login">

<h2>Login</h2>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Login</button>

</div>

</body>
</html>
