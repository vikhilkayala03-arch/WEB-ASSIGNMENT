<!DOCTYPE html>
<html>
<head>
<style>
.container {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 20px;
}

.left {
    background: lightblue;
    padding: 40px;
}

.right {
    background: lightgreen;
    padding: 40px;
}
</style>
</head>

<body>

<div class="container">

<div class="left">
    Sidebar
</div>

<div class="right">
    Main Content
</div>

</div>

</body>
</html>
