<!DOCTYPE html>
<html>
<head>
<style>
h1::before {
    content: "★ ";
}

h1::after {
    content: " ★";
}

p::first-letter {
    font-size: 40px;
    color: red;
}

p::first-line {
    font-weight: bold;
}
</style>
</head>

<body>

<h1>Pseudo Elements</h1>

<p>
This is an example of pseudo-elements.
The first letter and first line are styled differently.
</p>

</body>
</html>
