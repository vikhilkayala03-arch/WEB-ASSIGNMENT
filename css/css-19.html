<!DOCTYPE html>
<html>
<head>
<style>
nav {
    display: flex;
    justify-content: space-around;
    background: #222;
    padding: 15px;
}

nav a {
    color: white;
    text-decoration: none;
}

@media (max-width: 600px) {
    nav {
        flex-direction: column;
        gap: 15px;
        text-align: center;
    }
}
</style>
</head>

<body>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</nav>

</body>
</html>
