<!DOCTYPE html>
<html>
<head>
<style>
.linear {
    height: 200px;
    background: linear-gradient(to right, blue, purple);
    padding: 50px;
}

.radial {
    height: 200px;
    background: radial-gradient(circle, yellow, orange, red);
    padding: 50px;
}
</style>
</head>

<body>

<div class="linear">
    Linear Gradient
</div>

<br>

<div class="radial">
    Radial Gradient
</div>

</body>
</html>
