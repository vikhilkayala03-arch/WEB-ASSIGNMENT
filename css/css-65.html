<!DOCTYPE html>
<html>
<head>
<style>
.box {
    width: 150px;
    height: 150px;
    background: blue;
    transition: width 1s, height 1s, background 1s;
}

.box:hover {
    width: 300px;
    height: 200px;
    background: green;
}
</style>
</head>

<body>

<div class="box"></div>

</body>
</html>
