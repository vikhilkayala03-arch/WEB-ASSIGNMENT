<!DOCTYPE html>
<html>
<head>
<style>
.box {
    width: 100px;
    height: 100px;
    background: blue;
    animation: colorChange 4s infinite;
}

@keyframes colorChange {

    0% {
        background: blue;
    }

    50% {
        background: green;
        transform: scale(1.5);
    }

    100% {
        background: red;
        transform: scale(1);
    }

}
</style>
</head>

<body>

<div class="box"></div>

</body>
</html>
