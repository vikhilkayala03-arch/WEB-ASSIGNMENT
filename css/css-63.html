<!DOCTYPE html>
<html>
<head>
<style>
.container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.box {
    padding: 40px;
    background: lightblue;
}

@media(max-width:800px) {
    .container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width:500px) {
    .container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="box">1</div>
<div class="box">2</div>
<div class="box">3</div>
<div class="box">4</div>

</div>

</body>
</html>
