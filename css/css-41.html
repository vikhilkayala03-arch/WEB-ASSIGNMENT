<!DOCTYPE html>
<html>
<head>
<style>
.tooltip {
    position: relative;
    display: inline-block;
    margin: 100px;
}

.tip {
    visibility: hidden;
    background: black;
    color: white;
    padding: 10px;
    position: absolute;
    bottom: 100%;
    left: 0;
}

.tooltip:hover .tip {
    visibility: visible;
}
</style>
</head>

<body>

<div class="tooltip">

Hover over me

<span class="tip">
    This is a tooltip.
</span>

</div>

</body>
</html>
