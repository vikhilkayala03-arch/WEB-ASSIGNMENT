<!DOCTYPE html>
<html>
<head>
<style>
.container {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.box {
    padding: 40px;
    background: lightblue;
}

@media(min-width:768px) {
    .container {
        flex-direction: row;
    }

    .box {
        flex: 1;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="box">One</div>
<div class="box">Two</div>
<div class="box">Three</div>

</div>

</body>
</html>
