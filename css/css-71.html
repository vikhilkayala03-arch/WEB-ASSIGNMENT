<!DOCTYPE html>
<html>
<head>
<style>
:root {
    --background: white;
    --text: black;
}

body {
    background: var(--background);
    color: var(--text);
    padding: 30px;
}

.dark {
    --background: #111;
    --text: white;
}
</style>
</head>

<body>

<h1>Dark Mode</h1>

<p>This webpage uses CSS variables.</p>

<button onclick="document.body.classList.toggle('dark')">
    Toggle Dark Mode
</button>

</body>
</html>
