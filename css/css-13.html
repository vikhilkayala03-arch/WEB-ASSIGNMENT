<!DOCTYPE html>
<html>
<head>
<style>
form {
    width: 350px;
    margin: auto;
    padding: 25px;
    background: #f2f2f2;
    border-radius: 10px;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    background: green;
    color: white;
    border: none;
}
</style>
</head>

<body>

<form>
    <h2>Student Registration</h2>

    <input type="text" placeholder="Name">

    <input type="email" placeholder="Email">

    <input type="password" placeholder="Password">

    <select>
        <option>Select Course</option>
        <option>Python</option>
        <option>Java</option>
        <option>Data Science</option>
    </select>

    <button>Register</button>
</form>

</body>
</html>
