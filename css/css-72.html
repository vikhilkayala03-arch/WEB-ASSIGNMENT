<!DOCTYPE html>
<html>
<head>
<style>
h1 {
    font-size: 8vw;
}

p {
    font-size: 3vw;
}

@media(min-width:800px) {
    h1 {
        font-size: 60px;
    }

    p {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<h1>Responsive Heading</h1>

<p>
The font size changes according to screen width.
</p>

</body>
</html>
