<!DOCTYPE html>
<html>
<head>
<style>
form {
    max-width: 600px;
    margin: auto;
    padding: 30px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    box-sizing: border-box;
}

textarea {
    height: 150px;
}

button {
    padding: 12px 30px;
}
</style>
</head>

<body>

<form>

<h1>Contact Us</h1>

<input type="text" placeholder="Name">

<input type="email" placeholder="Email">

<textarea placeholder="Message"></textarea>

<button>Send Message</button>

</form>

</body>
</html>
