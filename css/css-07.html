<!DOCTYPE html>
<html>
<head>
<style>
body {
    height: 1200px;
}

.static {
    position: static;
    background: lightblue;
    padding: 20px;
}

.relative {
    position: relative;
    left: 50px;
    background: lightgreen;
    padding: 20px;
}

.parent {
    position: relative;
    width: 400px;
    height: 200px;
    background: lightgray;
}

.absolute {
    position: absolute;
    right: 10px;
    bottom: 10px;
    background: orange;
    padding: 20px;
}

.fixed {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: red;
    color: white;
    padding: 15px;
}

.sticky {
    position: sticky;
    top: 0;
    background: purple;
    color: white;
    padding: 15px;
}
</style>
</head>

<body>

<div class="static">Static</div>

<div class="relative">Relative</div>

<div class="sticky">Sticky</div>

<br>

<div class="parent">
    Parent
    <div class="absolute">Absolute</div>
</div>

<div class="fixed">Fixed</div>

<p>Scroll the page to see positioning.</p>

</body>
</html>
