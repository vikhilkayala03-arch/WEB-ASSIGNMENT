<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    font-family: Arial;
}

header {
    background: #7b2d26;
    color: white;
    text-align: center;
    padding: 50px;
}

.menu {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    padding: 40px;
}

.item {
    flex: 1 1 200px;
    padding: 25px;
    background: #f5f5f5;
    text-align: center;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
    <h1>Food Paradise</h1>
    <p>Delicious Food, Great Taste</p>
</header>

<section class="menu">

<div class="item">
    <h2>Pizza</h2>
    <p>₹250</p>
</div>

<div class="item">
    <h2>Burger</h2>
    <p>₹150</p>
</div>

<div class="item">
    <h2>Biryani</h2>
    <p>₹220</p>
</div>

</section>

</body>
</html>
