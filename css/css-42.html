<!DOCTYPE html>
<html>
<head>
<style>
button {
    padding: 15px 30px;
    background: blue;
    color: white;
    border: none;
    transition: 0.4s;
}

button:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 15px gray;
}
</style>
</head>

<body>

<button>Hover Me</button>

</body>
</html>
