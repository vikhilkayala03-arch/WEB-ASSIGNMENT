<!DOCTYPE html>
<html>
<head>
<style>
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
}

.modal:target {
    display: block;
}

.content {
    background: white;
    width: 300px;
    margin: 150px auto;
    padding: 30px;
}
</style>
</head>

<body>

<a href="#popup">Open Popup</a>

<div class="modal" id="popup">

<div class="content">

<h2>Hello!</h2>

<p>This is a CSS-only modal.</p>

<a href="#">Close</a>

</div>

</div>

</body>
</html>
