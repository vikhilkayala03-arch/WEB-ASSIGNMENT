<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Grid Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        /* Main Dashboard Grid */
        .dashboard {
            display: grid;

            grid-template-columns: 220px 1fr;

            grid-template-rows: 70px 1fr;

            min-height: 100vh;
        }

        /* Header */
        .header {
            grid-column: 1 / 3;

            background-color: #183b7a;
            color: white;

            display: flex;
            align-items: center;
            padding: 0 30px;
        }

        .header h1 {
            font-size: 25px;
        }

        /* Sidebar */
        .sidebar {
            background-color: #222f3e;
            color: white;
            padding: 25px 15px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .sidebar a {
            display: block;

            color: white;
            text-decoration: none;

            padding: 15px;
            margin-bottom: 8px;

            border-radius: 5px;
        }

        .sidebar a:hover {
            background-color: #183b7a;
        }

        /* Main Content */
        .main {
            padding: 30px;
        }

        .main h2 {
            color: #183b7a;
            margin-bottom: 25px;
        }

        /* Cards Grid */
        .cards {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
        }

        .card {
            background-color: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .card h3 {
            color: #183b7a;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 25px;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 800px) {

            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }

            .header {
                grid-column: 1;
            }

            .sidebar {
                text-align: center;
            }

            .sidebar a {
                display: inline-block;
                margin: 5px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- Header -->
        <header class="header">
            <h1>Student Dashboard</h1>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>Menu</h2>

            <a href="#">Dashboard</a>
            <a href="#">Students</a>
            <a href="#">Courses</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>

        </aside>

        <!-- Main Content -->
        <main class="main">

            <h2>Dashboard Overview</h2>

            <div class="cards">

                <div class="card">
                    <h3>Total Students</h3>
                    <p>500</p>
                </div>

                <div class="card">
                    <h3>Total Courses</h3>
                    <p>25</p>
                </div>

                <div class="card">
                    <h3>Teachers</h3>
                    <p>40</p>
                </div>

                <div class="card">
                    <h3>Completed</h3>
                    <p>350</p>
                </div>

                <div class="card">
                    <h3>Pending</h3>
                    <p>100</p>
                </div>

                <div class="card">
                    <h3>New Students</h3>
                    <p>50</p>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
