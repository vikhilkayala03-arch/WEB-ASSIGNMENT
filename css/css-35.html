<!DOCTYPE html>
<html>
<head>
<style>
.box {
    width: 250px;
    height: 100px;
    border: 2px solid black;
    overflow: auto;
}
</style>
</head>

<body>

<div class="box">

This is a long text inside a small box.
The overflow property controls what happens when content is too large.
This box uses auto overflow and therefore scrollbars can appear.

</div>

</body>
</html>
