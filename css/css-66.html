<!DOCTYPE html>
<html>
<head>
<style>
.twoD {
    width: 150px;
    height: 150px;
    background: blue;
    transform: rotate(30deg);
    margin: 50px;
}

.threeD {
    width: 150px;
    height: 150px;
    background: red;
    transform: perspective(500px) rotateY(45deg);
    margin: 100px;
}
</style>
</head>

<body>

<div class="twoD">
    2D
</div>

<div class="threeD">
    3D
</div>

</body>
</html>
