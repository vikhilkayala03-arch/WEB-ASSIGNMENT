<!DOCTYPE html>
<html>
<head>
<style>
.container {
    width: calc(100% - 40px);
    margin: 20px;
    padding: 30px;
    background: lightblue;
}

.box {
    width: calc(50% - 20px);
    padding: 20px;
    background: lightgreen;
}
</style>
</head>

<body>

<div class="container">

<h1>CSS calc()</h1>

<div class="box">
    Width = 50% - 20px
</div>

</div>

</body>
</html>
