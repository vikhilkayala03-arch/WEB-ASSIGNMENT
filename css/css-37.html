<!DOCTYPE html>
<html>
<head>
<style>
.block {
    display: block;
    background: lightblue;
    padding: 20px;
}

.inline {
    display: inline;
    background: yellow;
}

.inline-block {
    display: inline-block;
    background: lightgreen;
    padding: 20px;
}

.none {
    display: none;
}
</style>
</head>

<body>

<div class="block">Block</div>

<span class="inline">Inline</span>

<div class="inline-block">Inline Block</div>

<div class="none">You cannot see me.</div>

</body>
</html>
