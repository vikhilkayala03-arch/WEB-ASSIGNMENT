<!DOCTYPE html>
<html>
<head>
<style>
img {
    width: 200px;
    margin: 10px;
}

.blur {
    filter: blur(4px);
}

.gray {
    filter: grayscale(100%);
}

.bright {
    filter: brightness(1.8);
}

.contrast {
    filter: contrast(200%);
}
</style>
</head>

<body>

<img src="https://picsum.photos/200?1">

<img class="blur" src="https://picsum.photos/200?2">

<img class="gray" src="https://picsum.photos/200?3">

<img class="bright" src="https://picsum.photos/200?4">

<img class="contrast" src="https://picsum.photos/200?5">

</body>
</html>
