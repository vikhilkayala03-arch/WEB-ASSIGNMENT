<!DOCTYPE html>
<html>
<head>
<style>
a:hover {
    color: red;
}

a:active {
    color: green;
}

input:focus {
    background-color: lightyellow;
}

a:visited {
    color: purple;
}

button:hover {
    background-color: blue;
    color: white;
}
</style>
</head>

<body>

<h1>Pseudo Classes</h1>

<a href="https://example.com">Visit Website</a>

<br><br>

<input type="text" placeholder="Click here">

<br><br>

<button>Hover Me</button>

</body>
</html>
