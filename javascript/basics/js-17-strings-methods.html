<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strings and String Methods</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Strings and String Methods</h1><p>Demonstrate common string methods.</p></header>
<main class="container">
<div class="card">
<input id="s" value="JavaScript"><button onclick="run()">Show Methods</button><pre id="out"></pre>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let s=document.getElementById('s').value;out.textContent=`Upper: ${s.toUpperCase()}\nLower: ${s.toLowerCase()}\nLength: ${s.length}\nReversed: ${[...s].reverse().join('')}`;}
</script>
</body>
</html>
