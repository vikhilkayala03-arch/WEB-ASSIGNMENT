<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrow Functions</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Arrow Functions</h1><p>Demonstrate arrow function syntax.</p></header>
<main class="container">
<div class="card">
<input id="n" type="number" value="5"><button onclick="run()">Double</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
const double=n=>n*2;function run(){out.textContent='Double: '+double(+n.value);}
</script>
</body>
</html>
