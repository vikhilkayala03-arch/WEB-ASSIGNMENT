<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fibonacci Series</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Fibonacci Series</h1><p>Generate a Fibonacci series.</p></header>
<main class="container">
<div class="card">
<input id="n" type="number" min="1" value="10"><button onclick="run()">Generate</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let n=+document.getElementById('n').value,a=0,b=1,r=[];for(let i=0;i<n;i++){r.push(a);[a,b]=[b,a+b]}out.textContent=r.join(', ');}
</script>
</body>
</html>
