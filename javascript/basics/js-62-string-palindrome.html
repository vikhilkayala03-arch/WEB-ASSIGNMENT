<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
<header><h1>String Palindrome</h1><p>Demonstrate String Palindrome.</p></header>
<main class="container">
<div class="card">
<input id="a" value="12"><input id="b" value="8"><button onclick="run()">Run</button><pre id="out"></pre>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let s=a.value;out.textContent=s===s.split('').reverse().join('')?'Palindrome':'Not Palindrome'}
</script>
</body>
