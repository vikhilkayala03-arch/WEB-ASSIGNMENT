<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrays and Array Methods</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Arrays and Array Methods</h1><p>Demonstrate array methods.</p></header>
<main class="container">
<div class="card">
<input id="arr" value="Apple,Banana,Orange"><button onclick="run()">Show</button><pre id="out"></pre>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let a=arr.value.split(',');out.textContent=`Original: ${a}\nmap: ${a.map(x=>x.toUpperCase())}\nfilter: ${a.filter(x=>x.length>5)}\njoin: ${a.join(' | ')}`;}
</script>
</body>
</html>
