<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factorial</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Factorial</h1><p>Calculate the factorial of a number.</p></header>
<main class="container">
<div class="card">
<input id="n" type="number" min="0"><button onclick="run()">Factorial</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let n=+document.getElementById('n').value,f=1;for(let i=2;i<=n;i++)f*=i;out.textContent='Factorial: '+f;}
</script>
</body>
</html>
