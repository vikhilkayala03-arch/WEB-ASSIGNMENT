<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sum of Digits</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Sum of Digits</h1><p>Find the sum of digits.</p></header>
<main class="container">
<div class="card">
<input id="n" type="number"><button onclick="run()">Calculate</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let s=Math.abs(+document.getElementById('n').value).toString(),sum=[...s].reduce((a,d)=>a+Number(d),0);out.textContent='Sum: '+sum;}
</script>
</body>
</html>
