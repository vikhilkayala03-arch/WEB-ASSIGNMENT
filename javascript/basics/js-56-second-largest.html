<!DOCTYPE html>

<body>
<header><h1>Second-Largest Element</h1><p>Demonstrate Second-Largest Element.</p></header>
<main class="container">
<div class="card">
<input id="a" value="12"><input id="b" value="8"><button onclick="run()">Run</button><pre id="out"></pre>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let x=a.value.split(',').map(Number).sort((p,q)=>q-p);out.textContent='Second largest: '+[...new Set(x)][1]}
</script>
</body>
