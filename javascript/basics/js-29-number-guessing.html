<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Number Guessing Game</h1><p>Guess a number from 1 to 10</p></header>
<main class="container">
<div class="card">
<input id="g" type="number" min="1" max="10"><button onclick="run()">Guess</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
let target=Math.floor(Math.random()*10)+1;function run(){out.textContent=(+g.value===target)?'Correct! New number generated.':'Try again!';if(+g.value===target)target=Math.floor(Math.random()*10)+1;}
</script>
</body>
</html>
