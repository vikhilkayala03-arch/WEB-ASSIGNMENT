<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Largest and Smallest in Array</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Largest and Smallest in Array</h1><p>Find maximum and minimum array values.</p></header>
<main class="container">
<div class="card">
<input id="arr" value="5,2,9,1,7"><button onclick="run()">Find</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let a=arr.value.split(',').map(Number);out.textContent=`Largest: ${Math.max(...a)}, Smallest: ${Math.min(...a)}`;}
</script>
</body>
</html>
