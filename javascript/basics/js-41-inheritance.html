<body>
<header><h1>Inheritance</h1><p>Demonstrate Inheritance.</p></header>
<main class="container">
<div class="card">
<button onclick="run()">Run</button><p id="out"></p>
</div>
<nav class="nav">

</main>
<script>
class Animal{sound(){return 'Animal sound'}}class Dog extends Animal{sound(){return 'Dog barks'}}function run(){out.textContent=new Dog().sound()}
</script>
</body>
