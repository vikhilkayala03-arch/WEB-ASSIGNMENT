<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Functions</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>JavaScript Functions</h1><p>Demonstrate a reusable function.</p></header>
<main class="container">
<div class="card">
<input id="n" type="number" value="5"><button onclick="run()">Square</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function square(n){return n*n} function run(){out.textContent='Square: '+square(+n.value);}
</script>
</body>
</html>
