<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Stopwatch</h1><p>Create a stopwatch</p></header>
<main class="container">
<div class="card">
<div id="out">00:00:00</div><button onclick="start()">Start</button><button onclick="stop()">Stop</button><button onclick="reset()">Reset</button>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
let t=0,id;function show(){out.textContent=new Date(t*1000).toISOString().slice(11,19)}function start(){if(!id)id=setInterval(()=>{t++;show()},1000)}function stop(){clearInterval(id);id=null}function reset(){stop();t=0;show()}
</script>
</body>
</html>
