<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Application</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Quiz Application</h1><p>Create a simple quiz</p></header>
<main class="container">
<div class="card">
<p>Which language runs in the browser?</p><button onclick="check('Java')">Java</button><button onclick="check('JavaScript')">JavaScript</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function check(x){out.textContent=x==='JavaScript'?'Correct!':'Try again.';}
</script>
</body>
</html>
