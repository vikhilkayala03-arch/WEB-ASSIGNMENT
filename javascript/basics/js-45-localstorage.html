<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>localStorage</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>localStorage</h1><p>Demonstrate localStorage.</p></header>
<main class="container">
<div class="card">
<input id="v" placeholder="Value"><button onclick="save()">Save</button><button onclick="load()">Load</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function save(){localStorage.setItem('demo',v.value);out.textContent='Saved'}function load(){out.textContent=localStorage.getItem('demo')||'No data'}
</script>
</body>
</html>
