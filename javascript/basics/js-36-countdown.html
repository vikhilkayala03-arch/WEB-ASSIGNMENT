<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Timer</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Countdown Timer</h1><p>Create a countdown timer</p></header>
<main class="container">
<div class="card">
<input id="sec" type="number" value="10"><button onclick="start()">Start</button><b id="out"></b>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
let id;function start(){clearInterval(id);let n=+sec.value;out.textContent=n;id=setInterval(()=>{out.textContent=--n;if(n<=0)clearInterval(id)},1000)}
</script>
</body>
</html>
