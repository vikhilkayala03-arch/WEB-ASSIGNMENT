<body>
<header><h1>Email Validation with Regular Expression</h1><p>Demonstrate Email Validation with Regular Expression.</p></header>
<main class="container">
<div class="card">
<input id="a" value="12"><input id="b" value="8"><button onclick="run()">Run</button><pre id="out"></pre>
</div>
<nav class="nav">

</main>
<script>
function run(){out.textContent=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a.value)?'Valid email':'Invalid email'}
</script>
