<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armstrong Number</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Armstrong Number</h1><p>Demonstrate Armstrong Number.</p></header>
<main class="container">
<div class="card">
<input id="a" value="12"><input id="b" value="8"><button onclick="run()">Run</button><pre id="out"></pre>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let n=a.value,s=[...n],p=s.length,sum=s.reduce((x,d)=>x+d**p,0);out.textContent=sum==+n?'Armstrong':'Not Armstrong'}
</script>
</body>
</html>
