<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Number</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Prime Number</h1><p>Check whether a number is prime.</p></header>
<main class="container">
<div class="card">
<input id="n" type="number"><button onclick="run()">Check</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let n=+document.getElementById('n').value,p=n>1;for(let i=2;i*i<=n;i++)if(n%i===0)p=false;out.textContent=p?'Prime':'Not Prime';}
</script>
</body>
</html>
