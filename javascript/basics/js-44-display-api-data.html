<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display API Data Dynamically</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Display API Data Dynamically</h1><p>Demonstrate Display API Data Dynamically.</p></header>
<main class="container">
<div class="card">
<button onclick="run()">Fetch Data</button><pre id="out">Click to fetch.</pre>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
async function run(){try{let r=await fetch('https://jsonplaceholder.typicode.com/todos/1');let d=await r.json();out.textContent=JSON.stringify(d,null,2)}catch(e){out.textContent='Network/API unavailable in this environment.'}}
</script>
</body>
</html>
