<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverse a Number</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Reverse a Number</h1><p>Reverse the digits of a number.</p></header>
<main class="container">
<div class="card">
<input id="n" type="number"><button onclick="run()">Reverse</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let s=document.getElementById('n').value;out.textContent='Reverse: '+s.split('').reverse().join('');}
</script>
</body>
</html>
