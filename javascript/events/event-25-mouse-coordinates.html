<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouse Coordinate Tracker</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Mouse Coordinate Tracker</h1><p>Display mouse coordinates.</p></header>
<main class="container">
<div class="card">
<div id="area" style="height:180px;border:1px solid"></div><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
area.onmousemove=e=>out.textContent=`X:${e.clientX}, Y:${e.clientY}`;
</script>
</body>
</html>
