<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>removeEventListener</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>removeEventListener</h1><p>Remove an event listener.</p></header>
<main class="container">
<div class="card">
<button id="b">Click</button><button onclick="remove()">Remove Listener</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function say(){out.textContent='Listener active'}b.addEventListener('click',say);function remove(){b.removeEventListener('click',say)}
</script>
</body>
</html>
