<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Delegation</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Event Delegation</h1><p>Handle child clicks from parent.</p></header>
<main class="container">
<div class="card">
<ul id="list"><li>One</li><li>Two</li><li>Three</li></ul><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
list.onclick=e=>{if(e.target.tagName==='LI')out.textContent='Clicked '+e.target.textContent};
</script>
</body>
</html>
