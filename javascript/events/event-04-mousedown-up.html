<!DOCTYPE html>

</head>
<body>
<header><h1>mousedown and mouseup</h1><p>Demonstrate mouse button events.</p></header>
<main class="container">
<div class="card">
<button id="b">Press</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
b.onmousedown=()=>out.textContent='Mouse down';b.onmouseup=()=>out.textContent='Mouse up';
</script>
</body>
</html>
