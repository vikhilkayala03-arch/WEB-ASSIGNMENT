<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display Key Pressed</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Display Key Pressed</h1><p>Display the key pressed.</p></header>
<main class="container">
<div class="card">
<input id="i" placeholder="Press a key"><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
i.addEventListener('keydown',e=>out.textContent='Pressed: '+e.key);
</script>
</body>
</html>
