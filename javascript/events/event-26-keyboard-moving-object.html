<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyboard Controlled Moving Object</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Keyboard Controlled Moving Object</h1><p>Move an object with arrow keys.</p></header>
<main class="container">
<div class="card">
<div id="obj" style="position:relative;left:0;width:40px;height:40px;border:1px solid">■</div><p>Use arrow keys</p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
let x=0;document.onkeydown=e=>{if(e.key==='ArrowRight')x+=10;if(e.key==='ArrowLeft')x-=10;obj.style.left=x+'px'};
</script>
</body>
</html>
