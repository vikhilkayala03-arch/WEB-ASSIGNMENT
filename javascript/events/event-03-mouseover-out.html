<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mouseover and mouseout</title>

</head>
<body>
<header><h1>mouseover and mouseout</h1><p>Demonstrate mouse enter/leave.</p></header>
<main class="container">
<div class="card">
<div id="box" style="padding:30px;border:1px solid">Hover me</div>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
box.onmouseover=()=>box.textContent='Mouse over';box.onmouseout=()=>box.textContent='Mouse out';
</script>
</body>
</html>
