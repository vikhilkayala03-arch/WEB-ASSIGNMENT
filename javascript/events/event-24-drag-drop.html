<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drag and Drop</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Drag and Drop</h1><p>Drag an item into a target.</p></header>
<main class="container">
<div class="card">
<div id="drag" draggable="true" style="padding:15px;border:1px solid">Drag me</div><div id="drop" style="padding:30px;border:1px dashed;margin-top:10px">Drop here</div><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
drag.ondragstart=e=>e.dataTransfer.setData('text','x');drop.ondragover=e=>e.preventDefault();drop.ondrop=()=>out.textContent='Dropped successfully';
</script>
</body>
</html>
