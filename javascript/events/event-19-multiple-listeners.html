<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiple Event Listeners</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Multiple Event Listeners</h1><p>Add multiple listeners to one element.</p></header>
<main class="container">
<div class="card">
<button id="b">Click</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
b.addEventListener('click',()=>out.textContent='First listener');b.addEventListener('click',()=>out.textContent+=' + second listener');
</script>
</body>
</html>
