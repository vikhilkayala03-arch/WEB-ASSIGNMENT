<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Textarea Validation</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Textarea Validation</h1><p>Validate a textarea.</p></header>
<main class="container">
<div class="card">
<form id="f"><input id="name" placeholder="Name" required><input id="email" type="email" placeholder="Email" required><input id="phone" placeholder="10-digit phone"><input id="password" type="password" placeholder="Password"><button>Validate</button></form><pre id="out"></pre>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
f.onsubmit=e=>{e.preventDefault();let errors=[];if(!name.value.trim())errors.push('Name is required');if(email.value&&!/^\S+@\S+\.\S+$/.test(email.value))errors.push('Invalid email');if(phone.value&&!/^\d{10}$/.test(phone.value))errors.push('Phone must contain 10 digits');if(password.value&&password.value.length<6)errors.push('Password needs 6+ characters');out.textContent=errors.length?errors.join('\n'):'Validation successful!';}
</script>
</body>
</html>
