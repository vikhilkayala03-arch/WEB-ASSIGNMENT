<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Meter</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Password Strength Meter</h1><p>Show password strength.</p></header>
<main class="container">
<div class="card">
<input id="password" type="password" oninput="run()" placeholder="Password"><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let p=password.value,s=0;if(p.length>=8)s++;if(/[A-Z]/.test(p))s++;if(/[0-9]/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;out.textContent=['Weak','Fair','Good','Strong','Very Strong'][s]}
</script>
</body>
</html>
