<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Order Form</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Shopping Order Form</h1><p>Calculate order total.</p></header>
<main class="container">
<div class="card">
<input id="price" type="number" value="100"><input id="qty" type="number" value="2"><button onclick="run()">Total</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){out.textContent='Total: '+(+price.value*+qty.value)}
</script>
</body>
</html>
