<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Admission Form</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>College Admission Form</h1><p>Validate admission details.</p></header>
<main class="container">
<div class="card">
<form id="f"><input id="name" placeholder="Student name" required><select id="course" required><option value="">Select course</option><option>BCA</option><option>BSc</option></select><button>Submit</button></form><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
f.onsubmit=e=>{e.preventDefault();out.textContent=f.checkValidity()?'Admission form valid':'Please complete all fields'}
</script>
</body>
</html>
