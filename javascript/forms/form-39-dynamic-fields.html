<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Fields</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Dynamic Fields</h1><p>Show fields based on selection.</p></header>
<main class="container">
<div class="card">
<select id="type" onchange="run()"><option>Student</option><option>Employee</option></select><div id="out"></div>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){out.innerHTML=type.value==='Student'?'<input placeholder="Course">':'<input placeholder="Company">'}run()
</script>
</body>
</html>
