<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock using setInterval</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Digital Clock using setInterval</h1><p>Display current time.</p></header>
<main class="container">
<div class="card">
<div id="out" class="clock"></div>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
setInterval(()=>out.textContent=new Date().toLocaleTimeString(),1000);
</script>
</body>
</html>
