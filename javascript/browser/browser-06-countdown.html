<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Timer</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Countdown Timer</h1><p>Create countdown.</p></header>
<main class="container">
<div class="card">
<input id="n" value="10" type="number"><button onclick="run()">Start</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
let id;function run(){let x=+n.value;clearInterval(id);out.textContent=x;id=setInterval(()=>{out.textContent=--x;if(x<=0)clearInterval(id)},1000)}
</script>
</body>
</html>
