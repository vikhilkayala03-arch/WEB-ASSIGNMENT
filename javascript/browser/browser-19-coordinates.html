<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geographical Coordinates</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Geographical Coordinates</h1><p>Display current coordinates.</p></header>
<main class="container">
<div class="card">
<button onclick="run()">Get Coordinates</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){navigator.geolocation.getCurrentPosition(p=>out.textContent=`${p.coords.latitude}, ${p.coords.longitude}`,()=>out.textContent='Location unavailable')}
</script>
</body>
</html>
