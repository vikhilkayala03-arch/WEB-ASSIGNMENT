<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>setTimeout</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>setTimeout</h1><p>Execute code after a delay.</p></header>
<main class="container">
<div class="card">
<button onclick="run()">Start</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){out.textContent='Waiting...';setTimeout(()=>out.textContent='Done after 2 seconds',2000)}
</script>
</body>
</html>
