<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Array using JSON</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Store Array using JSON</h1><p>Store an array using JSON.</p></header>
<main class="container">
<div class="card">
<button onclick="run()">Store Array</button><pre id="out"></pre>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let a=['HTML','CSS','JS'];localStorage.setItem('subjects',JSON.stringify(a));out.textContent=JSON.parse(localStorage.getItem('subjects')).join(', ')}
</script>
</body>
</html>
