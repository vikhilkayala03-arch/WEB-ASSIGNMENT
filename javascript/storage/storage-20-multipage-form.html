<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-page Form with sessionStorage</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Multi-page Form with sessionStorage</h1><p>Persist data across pages.</p></header>
<main class="container">
<div class="card">
<input id="v" placeholder="Data"><button onclick="save()">Save to session</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function save(){sessionStorage.pageData=v.value;out.textContent='Saved: '+sessionStorage.pageData}
</script>
</body>
</html>
