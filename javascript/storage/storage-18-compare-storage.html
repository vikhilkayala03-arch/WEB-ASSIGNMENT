<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>localStorage vs sessionStorage</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>localStorage vs sessionStorage</h1><p>Compare browser storage.</p></header>
<main class="container">
<div class="card">
<button onclick="run()">Run</button><pre id="out"></pre>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){localStorage.setItem('persistent','yes');sessionStorage.setItem('temporary','yes');out.textContent=`localStorage: ${localStorage.persistent}\nsessionStorage: ${sessionStorage.temporary}\nlocalStorage persists until cleared; sessionStorage lasts for the session.`}
</script>
</body>
</html>
