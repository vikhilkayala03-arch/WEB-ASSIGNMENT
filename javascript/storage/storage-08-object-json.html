<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Store Object using JSON</title>

</head>
<body>
<header><h1>Store Object using JSON</h1><p>Store an object using JSON.</p></header>
<main class="container">
<div class="card">
<button onclick="run()">Store Object</button><pre id="out"></pre>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let o={name:'Student',mark:90};localStorage.setItem('student',JSON.stringify(o));out.textContent=JSON.stringify(JSON.parse(localStorage.getItem('student')),null,2)}
</script>
</body>
</html>
