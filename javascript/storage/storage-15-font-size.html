<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preferred Font Size</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Preferred Font Size</h1><p>Persist font size.</p></header>
<main class="container">
<div class="card">
<input id="size" type="range" min="12" max="32" value="16" oninput="run()"><p id="out">Sample text</p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){document.body.style.fontSize=size.value+'px';localStorage.fontSize=size.value}if(localStorage.fontSize){size.value=localStorage.fontSize;run()}
</script>
</body>
</html>
