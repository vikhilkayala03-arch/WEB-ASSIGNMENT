<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add and Delete Table Rows</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Add and Delete Table Rows</h1><p>Manage table rows dynamically.</p></header>
<main class="container">
<div class="card">
<table id="tbl"><tr><th>Name</th><th>Action</th></tr></table><input id="name"><button onclick="addRow()">Add</button>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function addRow(){let r=tbl.insertRow();r.insertCell().textContent=name.value;let b=document.createElement('button');b.textContent='Delete';b.onclick=()=>r.remove();r.insertCell().appendChild(b)}
</script>
</body>
</html>
