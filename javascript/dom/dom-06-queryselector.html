<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>querySelector and querySelectorAll</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>querySelector and querySelectorAll</h1><p>Demonstrate CSS selector methods.</p></header>
<main class="container">
<div class="card">
<p class="x">A</p><p class="x">B</p><button onclick="run()">Run</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){out.textContent='querySelector: '+document.querySelector('.x').textContent+'; count: '+document.querySelectorAll('.x').length}
</script>
</body>
</html>
