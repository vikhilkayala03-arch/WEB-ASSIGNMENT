<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Unordered List</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Dynamic Unordered List</h1><p>Build a list from an array.</p></header>
<main class="container">
<div class="card">
<button onclick="run()">Create</button><ul id="out"></ul>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){['HTML','CSS','JavaScript'].forEach(x=>{let li=document.createElement('li');li.textContent=x;out.appendChild(li)})}
</script>
</body>
</html>
