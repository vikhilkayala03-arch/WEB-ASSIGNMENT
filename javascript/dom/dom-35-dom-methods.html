<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>createElement appendChild remove replaceChild</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>createElement appendChild remove replaceChild</h1><p>Demonstrate common DOM methods.</p></header>
<main class="container">
<div class="card">
<button onclick="run()">Run DOM Methods</button><div id="out"></div>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let a=document.createElement('p');a.textContent='Created';out.appendChild(a);let b=document.createElement('p');b.textContent='Replacement';a.replaceWith(b);let c=document.createElement('p');c.textContent='Removed';out.appendChild(c);c.remove()}
</script>
</body>
</html>
