<body>
<header><h1>Add Elements Dynamically</h1><p>Create and append a new element.</p></header>
<main class="container">
<div class="card">
<button onclick="run()">Add Element</button><div id="out"></div>
</div>
<nav class="nav">

</nav>
</main>
<script>
function run(){let p=document.createElement('p');p.textContent='New element added dynamically.';out.appendChild(p)}
</script>
</body>
