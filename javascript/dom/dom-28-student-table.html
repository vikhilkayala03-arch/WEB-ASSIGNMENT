<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Student Table</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Dynamic Student Table</h1><p>Create a student table.</p></header>
<main class="container">
<div class="card">
<button onclick="run()">Create</button><div id="out"></div>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let t=document.createElement('table');[['Name','Mark'],['Ravi',90],['Sita',95]].forEach(r=>{let tr=t.insertRow();r.forEach(c=>tr.insertCell().textContent=c)});out.appendChild(t)}
</script>
</body>
</html>
