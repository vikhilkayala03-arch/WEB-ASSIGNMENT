<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Dropdown</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Dynamic Dropdown</h1><p>Add options to a select element.</p></header>
<main class="container">
<div class="card">
<select id="sel"></select><button onclick="run()">Load Options</button>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){['HTML','CSS','JavaScript'].forEach(x=>sel.add(new Option(x,x)))}
</script>
</body>
</html>
