<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>getElementById and getElementsByClassName</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>getElementById and getElementsByClassName</h1><p>Demonstrate DOM selection methods.</p></header>
<main class="container">
<div class="card">
<p id="one">ID</p><p class="c">A</p><p class="c">B</p><button onclick="run()">Run</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){out.textContent=`ID: ${document.getElementById('one').textContent}; class count: ${document.getElementsByClassName('c').length}`}
</script>
</body>
</html>
