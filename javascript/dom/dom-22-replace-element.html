<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Replace Element</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Replace Element</h1><p>Replace an element.</p></header>
<main class="container">
<div class="card">
<p id="out">Old</p><button onclick="run()">Replace</button>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let n=document.createElement('p');n.textContent='New element';out.replaceWith(n)}
</script>
</body>
</html>
