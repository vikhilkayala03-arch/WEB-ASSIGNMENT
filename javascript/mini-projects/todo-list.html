<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List Application</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>To-Do List Application</h1><p>Add and delete tasks.</p></header>
<main class="container">
<div class="card">
<input id="task"><button onclick="add()">Add</button><ul id="list"></ul>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function add(){if(!task.value.trim())return;let li=document.createElement('li');li.textContent=task.value;li.onclick=()=>li.remove();list.appendChild(li);task.value=''}
</script>
</body>
</html>
