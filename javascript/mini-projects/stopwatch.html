<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Stopwatch</h1><p>A functional stopwatch.</p></header>
<main class="container">
<div class="card">
<div id="out">00:00</div><button onclick="start()">Start</button><button onclick="stop()">Stop</button><button onclick="reset()">Reset</button>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
let n=0,id;function show(){out.textContent=`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}function start(){if(!id)id=setInterval(()=>{n++;show()},1000)}function stop(){clearInterval(id);id=null}function reset(){stop();n=0;show()}
</script>
</body>
</html>
