<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Password Generator</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Random Password Generator</h1><p>Generate a random password.</p></header>
<main class="container">
<div class="card">
<button onclick="run()">Generate</button><input id="out" readonly>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%';out.value=Array.from({length:12},()=>chars[Math.floor(Math.random()*chars.length)]).join('')}
</script>
</body>
</html>
