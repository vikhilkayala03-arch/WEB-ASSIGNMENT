<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter using API</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Currency Converter using API</h1><p>Convert currencies using a public API.</p></header>
<main class="container">
<div class="card">
<input id="amount" type="number" value="1"><input id="from" value="USD"><input id="to" value="INR"><button onclick="run()">Convert</button><p id="out"></p>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
async function run(){try{let r=await fetch(`https://api.frankfurter.app/latest?amount=${amount.value}&from=${from.value}&to=${to.value}`);let d=await r.json();out.textContent=JSON.stringify(d.rates)}catch(e){out.textContent='API unavailable. Check internet connection.'}}
</script>
</body>
</html>
