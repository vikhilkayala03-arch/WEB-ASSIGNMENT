<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Marks/Grade Calculator</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1>Student Marks/Grade Calculator</h1><p>Calculate total, average and grade.</p></header>
<main class="container">
<div class="card">
<input id="marks" value="80,90,70"><button onclick="run()">Calculate</button><pre id="out"></pre>
</div>
<nav class="nav">
<a class="btn" href="../../index.html">Home</a>
<a class="btn" href="index.html">Back to Programs</a>
</nav>
</main>
<script>
function run(){let a=marks.value.split(',').map(Number),t=a.reduce((x,y)=>x+y,0),avg=t/a.length;out.textContent=`Total: ${t}\nAverage: ${avg}\nGrade: ${avg>=90?'A+':avg>=75?'A':avg>=60?'B':'C'}`}
</script>
</body>
</html>
